# flags-2-env surface for `ghaiw-api`
#
# Secret-capable values are intentionally not public flags. In particular,
# GHA_INDIE_WORKER_NATS_URL may contain credentials and is read only from the
# runtime secret/environment boundary until flags-2-env supports env-only
# declarations (flags-2-env/flags-2-env#29).
[flags.config]
env = "GHA_INDIE_WORKER_CONFIG"
aliases = ["config"]
type = "string"
help = "Path to TOML configuration"

[flags.api_base]
env = "GHA_INDIE_WORKER_API_BASE"
aliases = ["api-base"]
type = "string"
help = "API HTTP base URL"

[flags.json]
env = "GHA_INDIE_WORKER_JSON"
aliases = ["json"]
type = "bool"
help = "Emit JSON"

[flags.gha-indie-worker-api-bind]
env = "GHA_INDIE_WORKER_API_BIND"
aliases = ["gha-indie-worker-api-bind"]
type = "string"
help = "Runtime environment key GHA_INDIE_WORKER_API_BIND."

[flags.gha-indie-worker-api-tcp-bind]
env = "GHA_INDIE_WORKER_API_TCP_BIND"
aliases = ["gha-indie-worker-api-tcp-bind"]
type = "string"
help = "Runtime environment key GHA_INDIE_WORKER_API_TCP_BIND."
