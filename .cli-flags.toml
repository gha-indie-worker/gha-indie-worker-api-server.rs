# Public flags-2-env surface for `ghaiw-api`.
#
# Secret-capable configuration is intentionally environment-only. In particular,
# GHA_INDIE_WORKER_NATS_URL may contain credentials and must never be accepted
# through argv/process listings.

[parse]
allow_unknown = false

[flags.gha-indie-worker-api-bind]
env = "GHA_INDIE_WORKER_API_BIND"
long = "gha-indie-worker-api-bind"
type = "string"
help = "HTTP listener binding."

[flags.gha-indie-worker-api-tcp-bind]
env = "GHA_INDIE_WORKER_API_TCP_BIND"
long = "gha-indie-worker-api-tcp-bind"
type = "string"
help = "Optional stateful TCP listener binding."
