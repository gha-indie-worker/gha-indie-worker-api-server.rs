# flags-2-env surface for `ghaiw-api`
[flags.config]
env = "GHA_INDIE_WORKER_CONFIG"
long = "config"
help = "Path to TOML configuration"

[flags.api_base]
env = "GHA_INDIE_WORKER_API_BASE"
long = "api-base"
help = "API HTTP base URL"

[flags.json]
env = "GHA_INDIE_WORKER_JSON"
long = "json"
switch = true
help = "Emit JSON"


[flags.gha-indie-worker-api-bind]
env = "GHA_INDIE_WORKER_API_BIND"
long = "gha-indie-worker-api-bind"
type = "string"
help = "Runtime environment key GHA_INDIE_WORKER_API_BIND."

[flags.gha-indie-worker-api-tcp-bind]
env = "GHA_INDIE_WORKER_API_TCP_BIND"
long = "gha-indie-worker-api-tcp-bind"
type = "string"
help = "Runtime environment key GHA_INDIE_WORKER_API_TCP_BIND."

[flags.gha-indie-worker-nats-url]
env = "GHA_INDIE_WORKER_NATS_URL"
long = "gha-indie-worker-nats-url"
type = "string"
help = "Runtime environment key GHA_INDIE_WORKER_NATS_URL."
