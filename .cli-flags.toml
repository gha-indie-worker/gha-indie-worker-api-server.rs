# flags-2-env surface for `ghaiw-api`
[help]
url = "https://github.com/gha-indie-worker/gha-indie-worker-api-server.rs"

[parse]
allow_unknown = false

[flags.config]
env = "GHA_INDIE_WORKER_CONFIG"
long = "config"
help = "Path to TOML configuration"

[flags.api_base]
env = "GHA_INDIE_WORKER_API_BASE"
long = "api-base"
help = "API HTTP base URL"

[flags.json]
env = "GHA_INDIE_WORKER_JSON"
long = "json"
switch = true
help = "Emit JSON"

[flags.bind]
env = "GHA_INDIE_WORKER_API_BIND"
aliases = ["bind", "gha-indie-worker-api-bind"]
type = "string"
default = "127.0.0.1:8080"
help = "HTTP bind address."

[flags.tcp-bind]
env = "GHA_INDIE_WORKER_API_TCP_BIND"
aliases = ["tcp-bind", "gha-indie-worker-api-tcp-bind"]
type = "string"
help = "Optional stateful TCP bind address."

[flags.nats-url]
env = "GHA_INDIE_WORKER_NATS_URL"
aliases = ["nats-url", "gha-indie-worker-nats-url"]
type = "string"
help = "Optional NATS URL."
