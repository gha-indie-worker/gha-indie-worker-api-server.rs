name: API flags and repository governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-and-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out API candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test without optional transports
        run: cargo test --locked --no-default-features

      - name: Test all features
        run: cargo test --locked --all-features

      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Check out pinned ores-cli governance runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-cli
          ref: e488618973f8400a8fc8b6f98ecc870c7ba12e39
          path: .ores-cli
          persist-credentials: false

      - name: Audit repository and flags-2-env contract with ores-cli
        working-directory: .ores-cli
        run: cargo run --locked --bin oresc -- audit repo --path "$GITHUB_WORKSPACE"
