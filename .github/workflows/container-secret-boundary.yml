name: container secret boundary

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/sops-entrypoint.sh'
      - '.github/workflows/container-secret-boundary.yml'
  push:
    branches:
      - 'fix/DEN-3945-runtime-only-sops-container-20260915'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce runtime-only secret material
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/sops-entrypoint.sh
          grep -Fq 'SOPS_SECRETS_FILE=/run/secrets/app.env' Dockerfile
          grep -Fq 'env/enc/**' .dockerignore
          grep -Fq 'env/dec/**' .dockerignore
          ! grep -Eq 'COPY .*env/(enc|dec)|ADD .*env/(enc|dec)|/app/secrets/app\.env' Dockerfile
          ! grep -Eq '^!env/enc|^!env/dec' .dockerignore
          ! grep -Eq '(^|[^A-Za-z])eval([^A-Za-z]|$)' scripts/sops-entrypoint.sh
          grep -Fq 'printenv "$key"' scripts/sops-entrypoint.sh
          git diff --exit-code HEAD
