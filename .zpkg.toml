[package]
org = "gha-indie-worker"
name = "gha-indie-worker-api-server"
version = "0.1.0"
language = "rust"
description = "JSON API server for GHA Indie Worker"
license = "MIT"

[package.repository]
vcs = "git"
url = "https://github.com/gha-indie-worker/gha-indie-worker-api-server.rs"

[dependencies]
"gha-indie-worker/gha-indie-worker-lib-core" = "^0.1.0"
"gha-indie-worker/gha-indie-worker-orm-core" = "^0.1.0"

[targets.rust]
dir = "."
adapter = "rust"

[install]
adapter = "none"
