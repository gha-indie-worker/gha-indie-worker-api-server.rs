    [package]
    name = "gha-indie-worker-api-server"
    version = "0.1.0"
    edition = "2021"
    license = "MIT"
    description = "JSON API server for GHA Indie Worker"
    repository = "https://github.com/gha-indie-worker/gha-indie-worker-api-server.rs"

    [features]
    default = ["tcp-transport", "nats-transport"]
    tcp-transport = []
    nats-transport = []

    [dependencies]
    flags2env = { version = "0.1.0", git = "https://github.com/flags-2-env/flags-2-env", rev = "d7bad9ea7dfc657653368237e08903514cdca1ec" }
    serde = { version = "1", features = ["derive"] }
    serde_json = "1"
    tempfile = "3"
    thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

