    [package]
    name = "gha-indie-worker-api-server"
    version = "0.1.0"
    edition = "2021"
    license = "MIT"
    description = "JSON API server for GHA Indie Worker"
    repository = "https://github.com/gha-indie-worker/gha-indie-worker-api-server.rs"

    [features]
    default = ["tcp-transport", "nats-transport"]
    tcp-transport = []
    nats-transport = []

    [dependencies]
gha-indie-worker-lib-core = { git = "https://github.com/gha-indie-worker/gha-indie-worker-lib-core.git", features = ["read-write"] }
ores-transport = { git = "https://github.com/ORESoftware/ores-transport.git", branch = "main" }  # TODO(DEN): pin to a rev once ores-transport is pushed
k8s-web-api-data-plane = { git = "https://github.com/ORESoftware/k8s-libs-and-shared-defs.git", rev = "55adadc9f6d223d40b28ae66097dfe16930951b1", package = "k8s-web-api-data-plane" }
    serde = { version = "1", features = ["derive"] }
    serde_json = "1"
    thiserror = "2"

[lints.rust]
unsafe_code = "forbid"


