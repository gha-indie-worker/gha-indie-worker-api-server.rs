[package]
name = "gha-indie-worker-api-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "JSON API server for GHA Indie Worker"
repository = "https://github.com/gha-indie-worker/gha-indie-worker-api-server.rs"

[features]
default = ["tcp-transport", "nats-transport"]
tcp-transport = []
nats-transport = []

[dependencies]
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[lints.rust]
unsafe_code = "forbid"
